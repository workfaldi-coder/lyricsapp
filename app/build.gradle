plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.spotifyyoutubeoverlay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.spotifyyoutubeoverlay'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK - zero third-party dependencies for fast, reliable builds
}
